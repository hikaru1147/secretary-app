<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自分専用の秘書アプリ</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #e2e6ed;
      --text: #1f2933;
      --muted: #7b8794;
      --primary: #3b6ef5;
      --primary-dark: #2c56c9;
      --danger: #e05252;
      --done: #9aa5b1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    /* ダッシュボード */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat {
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid transparent;
    }
    .stat .num { font-size: 30px; font-weight: 700; }
    .stat .label { font-size: 13px; font-weight: 600; }

    /* ダッシュボードの色分け */
    .stat.memos { background: #eef4ff; border-color: #cfe0ff; }
    .stat.memos .num { color: #2c56c9; }
    .stat.memos .label { color: #3b6ef5; }

    .stat.tasks { background: #fff4e6; border-color: #ffe0b8; }
    .stat.tasks .num { color: #c9781a; }
    .stat.tasks .label { color: #e08a2b; }

    .stat.open { background: #fdecec; border-color: #f7cccc; }
    .stat.open .num { color: #c33a3a; }
    .stat.open .label { color: #e05252; }

    /* 最新の振り返り（ダッシュボード内・1行コンパクト表示） */
    .latest-refl {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
      background: #f1fbf4;
      border: 1px solid #c7ecd4;
      border-radius: 10px;
      padding: 8px 14px;
      margin-bottom: 28px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .latest-refl:hover { background: #e6f7ec; border-color: #a6dfba; }
    .latest-refl::after {
      content: "›"; color: #1f9d55; font-weight: 700; font-size: 16px;
      margin-left: auto; white-space: nowrap;
    }
    .latest-refl .lr-head { font-weight: 700; color: #1f9d55; white-space: nowrap; }
    .latest-refl .lr-body { display: contents; }
    .latest-refl .lr-week { font-weight: 600; color: #1f9d55; white-space: nowrap; }
    .latest-refl .lr-comment {
      flex: 1; min-width: 120px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .latest-refl .lr-date { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .latest-refl .lr-empty { color: var(--muted); }

    /* 振り返り入力フォーム */
    .refl-week { display: block; margin-bottom: 10px; }
    .refl-week span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .refl-week input {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit;
    }
    .refl-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* 振り返り項目 */
    .refl-item {
      border: 1px solid var(--border);
      border-left: 4px solid #1f9d55;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .refl-item .r-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .refl-item .r-week { font-weight: 700; color: #1f9d55; flex: 1; }
    .refl-item .r-comment { white-space: pre-wrap; font-size: 14px; }
    .refl-item .r-date { color: var(--muted); font-size: 12px; margin-top: 6px; }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    section h2 { font-size: 16px; margin: 0 0 14px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
      resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      padding: 9px 16px;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }

    .row { display: flex; gap: 8px; }
    .row input { margin-bottom: 0; }
    .row .btn-primary { white-space: nowrap; }

    .list { list-style: none; margin: 0; padding: 0; }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

    /* メモ項目 */
    .memo-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .memo-item .m-head { display: flex; align-items: flex-start; gap: 8px; }
    .memo-item .m-title { font-weight: 600; margin-bottom: 4px; flex: 1; min-width: 0; word-break: break-word; }
    .memo-item .m-untitled { color: var(--muted); font-weight: 500; }
    .memo-item .m-body { white-space: pre-wrap; font-size: 14px; }
    .memo-item .m-date { color: var(--muted); font-size: 12px; margin-top: 6px; }

    /* タスク項目 */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .task-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex: none; }
    .task-item .t-main { flex: 1; min-width: 0; }
    .task-item .t-text { font-size: 14px; word-break: break-word; }
    .task-item.done .t-text { text-decoration: line-through; color: var(--done); }
    .task-item .t-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .badge {
      font-size: 11px; padding: 1px 8px; border-radius: 999px;
      background: #eef2ff; color: var(--primary); margin-left: 6px;
    }
    .badge.done { background: #eef1f4; color: var(--done); }
    .btn-del {
      background: transparent; color: var(--danger); font-size: 13px;
      padding: 4px 8px; flex: none;
    }
    .btn-del:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📝 自分専用の秘書アプリ</h1>
    <div class="sub">メモとタスクを管理できます。データは自動でファイルに保存されます。</div>

    <!-- ダッシュボード -->
    <div class="dashboard">
      <div class="stat memos"><div class="num" id="stat-memos">0</div><div class="label">メモの件数</div></div>
      <div class="stat tasks"><div class="num" id="stat-tasks">0</div><div class="label">タスクの件数</div></div>
      <div class="stat open"><div class="num" id="stat-open">0</div><div class="label">未完了タスク</div></div>
    </div>

    <!-- 最新の振り返り（クリックで一覧へ移動） -->
    <div class="latest-refl" id="latest-refl" onclick="goToReflList()" title="クリックで振り返り一覧へ移動">
      <span class="lr-head">📌 最新の振り返り</span>
      <span class="lr-body" id="latest-refl-body"><span class="lr-empty">まだ振り返りがありません。</span></span>
    </div>

    <!-- メモ追加 -->
    <section>
      <h2>メモを追加</h2>
      <input type="text" id="memo-title" placeholder="タイトル">
      <textarea id="memo-content" rows="3" placeholder="本文"></textarea>
      <button class="btn-primary" onclick="addMemo()">メモを追加</button>
    </section>

    <!-- メモ一覧 -->
    <section>
      <h2>メモ一覧</h2>
      <ul class="list" id="memo-list"></ul>
    </section>

    <!-- タスク追加 -->
    <section>
      <h2>タスクを追加</h2>
      <div class="row">
        <input type="text" id="task-text" placeholder="やることを入力" onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn-primary" onclick="addTask()">追加</button>
      </div>
    </section>

    <!-- タスク一覧 -->
    <section>
      <h2>タスク一覧</h2>
      <ul class="list" id="task-list"></ul>
    </section>

    <!-- 週次の振り返りを記録 -->
    <section>
      <h2>週次の振り返りを記録</h2>
      <div class="refl-form">
        <label class="refl-week">
          <span>対象の週</span>
          <input type="week" id="refl-week">
        </label>
        <textarea id="refl-comment" rows="3" placeholder="今週の振り返りコメント（できたこと・反省・来週やること など）"></textarea>
        <button class="btn-primary" onclick="saveReflection()">振り返りを記録</button>
        <div class="refl-note">※ 同じ週に記録すると内容が上書きされます。</div>
      </div>
    </section>

    <!-- 振り返り一覧 -->
    <section id="refl-list-section">
      <h2>振り返り一覧</h2>
      <ul class="list" id="refl-list"></ul>
    </section>
  </div>

  <script>
    // 日時を読みやすく整形
    function fmt(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // ===== データ保存（ブラウザ内の localStorage に保存）=====
    const STORAGE_KEY = 'secretary-app-data-v1';

    function loadState() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        return {
          memos: Array.isArray(d.memos) ? d.memos : [],
          tasks: Array.isArray(d.tasks) ? d.tasks : [],
          reflections: Array.isArray(d.reflections) ? d.reflections : [],
        };
      } catch (e) {
        return { memos: [], tasks: [], reflections: [] };
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '').slice(0, 16);
      return Math.random().toString(16).slice(2, 10) + Math.random().toString(16).slice(2, 10);
    }

    function refresh() {
      render(loadState());
    }

    // "2026-W30" を "2026年 第30週" に整形
    function fmtWeek(week) {
      const m = /^(\d{4})-W(\d{2})$/.exec(week);
      return m ? `${m[1]}年 第${Number(m[2])}週` : week;
    }

    function render(state) {
      const memos = state.memos || [];
      const tasks = state.tasks || [];
      const reflections = state.reflections || [];
      const open = tasks.filter((t) => !t.done).length;

      // ダッシュボード
      document.getElementById('stat-memos').textContent = memos.length;
      document.getElementById('stat-tasks').textContent = tasks.length;
      document.getElementById('stat-open').textContent = open;

      // 最新の振り返り（週が最も新しいもの = 先頭）
      const lrBody = document.getElementById('latest-refl-body');
      if (reflections.length === 0) {
        lrBody.innerHTML = '<span class="lr-empty">まだ振り返りがありません。</span>';
      } else {
        const r = reflections[0];
        lrBody.innerHTML = `
          <span class="lr-week">${esc(fmtWeek(r.week))}</span>
          <span class="lr-comment" title="${esc(r.comment)}">${esc(r.comment)}</span>
          <span class="lr-date">🕒 ${fmt(r.updatedAt || r.createdAt)}</span>`;
      }

      // 振り返り一覧
      const rl = document.getElementById('refl-list');
      if (reflections.length === 0) {
        rl.innerHTML = '<li class="empty">振り返りはまだありません。</li>';
      } else {
        rl.innerHTML = reflections.map((r) => `
          <li class="refl-item">
            <div class="r-head">
              <span class="r-week">${esc(fmtWeek(r.week))}</span>
              <button class="btn-del" onclick="deleteReflection('${r.id}')">削除</button>
            </div>
            <div class="r-comment">${esc(r.comment)}</div>
            <div class="r-date">🕒 ${fmt(r.updatedAt || r.createdAt)}</div>
          </li>`).join('');
      }

      // メモ一覧
      const ml = document.getElementById('memo-list');
      if (memos.length === 0) {
        ml.innerHTML = '<li class="empty">メモはまだありません。</li>';
      } else {
        ml.innerHTML = memos.map((m) => `
          <li class="memo-item">
            <div class="m-head">
              ${m.title ? `<div class="m-title">${esc(m.title)}</div>` : '<div class="m-title m-untitled">（無題）</div>'}
              <button class="btn-del" onclick="deleteMemo('${m.id}')">削除</button>
            </div>
            ${m.content ? `<div class="m-body">${esc(m.content)}</div>` : ''}
            <div class="m-date">🕒 ${fmt(m.createdAt)}</div>
          </li>`).join('');
      }

      // タスク一覧
      const tl = document.getElementById('task-list');
      if (tasks.length === 0) {
        tl.innerHTML = '<li class="empty">タスクはまだありません。</li>';
      } else {
        tl.innerHTML = tasks.map((t) => `
          <li class="task-item ${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}', this.checked)">
            <div class="t-main">
              <div class="t-text">${esc(t.text)}
                <span class="badge ${t.done ? 'done' : ''}">${t.done ? '完了' : '未完了'}</span>
              </div>
              <div class="t-meta">🕒 ${fmt(t.createdAt)}</div>
            </div>
            <button class="btn-del" onclick="deleteTask('${t.id}')">削除</button>
          </li>`).join('');
      }
    }

    function addMemo() {
      const title = document.getElementById('memo-title');
      const content = document.getElementById('memo-content');
      const t = title.value.trim();
      const c = content.value.trim();
      if (!t && !c) {
        alert('タイトルか本文を入力してください');
        return;
      }
      const state = loadState();
      state.memos.unshift({ id: newId(), title: t, content: c, createdAt: new Date().toISOString() });
      saveState(state);
      title.value = '';
      content.value = '';
      refresh();
    }

    function deleteMemo(id) {
      if (!confirm('このメモを削除しますか？')) return;
      const state = loadState();
      state.memos = state.memos.filter((m) => m.id !== id);
      saveState(state);
      refresh();
    }

    function saveReflection() {
      const weekEl = document.getElementById('refl-week');
      const commentEl = document.getElementById('refl-comment');
      const week = weekEl.value;
      const comment = commentEl.value.trim();
      if (!week) { alert('対象の週を選択してください'); return; }
      if (!comment) { alert('振り返りコメントを入力してください'); return; }
      const state = loadState();
      const now = new Date().toISOString();
      const existing = state.reflections.find((r) => r.week === week);
      if (existing) {
        existing.comment = comment;
        existing.updatedAt = now;
      } else {
        state.reflections.push({ id: newId(), week, comment, createdAt: now, updatedAt: now });
      }
      // 週の新しい順に並べ替え
      state.reflections.sort((a, b) => (a.week < b.week ? 1 : a.week > b.week ? -1 : 0));
      saveState(state);
      commentEl.value = '';
      refresh();
    }

    function goToReflList() {
      const sec = document.getElementById('refl-list-section');
      sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deleteReflection(id) {
      if (!confirm('この振り返りを削除しますか？')) return;
      const state = loadState();
      state.reflections = state.reflections.filter((r) => r.id !== id);
      saveState(state);
      refresh();
    }

    // 今週を "YYYY-Www" 形式で返す（ISO週番号）
    function currentIsoWeek() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      // 木曜日に合わせるとISO週番号が求まる
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const week1 = new Date(d.getFullYear(), 0, 4);
      const weekNo = 1 + Math.round(
        ((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7
      );
      return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function addTask() {
      const input = document.getElementById('task-text');
      const text = input.value.trim();
      if (!text) return;
      const state = loadState();
      state.tasks.unshift({ id: newId(), text, done: false, createdAt: new Date().toISOString() });
      saveState(state);
      input.value = '';
      refresh();
    }

    function toggleTask(id, done) {
      const state = loadState();
      const task = state.tasks.find((t) => t.id === id);
      if (task) task.done = done;
      saveState(state);
      refresh();
    }

    function deleteTask(id) {
      if (!confirm('このタスクを削除しますか？')) { refresh(); return; }
      const state = loadState();
      state.tasks = state.tasks.filter((t) => t.id !== id);
      saveState(state);
      refresh();
    }

    // 初回読み込み：週入力を今週で初期化してから表示
    document.getElementById('refl-week').value = currentIsoWeek();
    refresh();
  </script>
</body>
</html>
